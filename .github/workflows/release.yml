name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p duke-windows

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (cargo pkgid -p duke-windows) -replace '.*[@#]', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/O$PWD\dist" packaging\windows\duke-wallpaper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/DukeWallpaper-Windows-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Add both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release -p duke-mac --target aarch64-apple-darwin
          cargo build --release -p duke-mac --target x86_64-apple-darwin

      - name: Build app and disk image
        run: |
          version=$(cargo pkgid -p duke-mac | sed 's/.*[@#]//')
          app="dist/Duke Wallpaper.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/duke-wallpaper-mac" \
            target/aarch64-apple-darwin/release/duke-wallpaper-mac \
            target/x86_64-apple-darwin/release/duke-wallpaper-mac
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp packaging/macos/AppIcon.icns "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          mkdir disk-image
          cp -R "$app" disk-image/
          ln -s /Applications disk-image/Applications
          hdiutil create -volname "Duke Wallpaper" -srcfolder disk-image -ov -format UDZO dist/DukeWallpaper-macOS.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/DukeWallpaper-macOS.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo pkgid -p duke-core | sed 's/.*[@#]//')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the Cargo version $version"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## Install

          **Windows 10 or 11:** download `DukeWallpaper-Windows-Setup.exe` and run it. If Windows SmartScreen
          says it protected your PC, choose **More info**, then **Run anyway**.

          **macOS 11 or later:** download `DukeWallpaper-macOS.dmg`, open it and drag **Duke Wallpaper** into
          **Applications**. The first time you open it, macOS says it cannot verify the app: open
          **System Settings > Privacy & Security** and choose **Open Anyway**.

          Click the chapel-tower icon in the tray or menu bar to pick the scene, season, weather and time of day.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "Duke Wallpaper $version" --notes-file release-notes.md
